name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-custom"
      - "[0-9]+.[0-9]+.[0-9]+-custom-r[0-9]+"

jobs:
  build:
    runs-on: macos-15
    env:
      xcode_version: "26.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode for macOS
        run: sudo xcode-select -s '/Applications/Xcode_${{ env.xcode_version }}.app'

      - name: Build
        run: make

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.xz"
          allowUpdates: true
